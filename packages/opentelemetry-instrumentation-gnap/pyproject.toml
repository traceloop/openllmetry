[project]
name = "opentelemetry-instrumentation-gnap"
version = "0.62.3"
description = "OpenTelemetry GNAP agent coordination instrumentation"
authors = [{ name = "OpenLLMetry Contributors" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
  "opentelemetry-api>=1.38.0,<2",
  "opentelemetry-instrumentation>=0.59b0",
  "opentelemetry-semantic-conventions-ai>=0.5.1,<0.6.0",
]

[project.urls]
Repository = "https://github.com/traceloop/openllmetry/tree/main/packages/opentelemetry-instrumentation-gnap"

[project.entry-points."opentelemetry_instrumentor"]
gnap = "opentelemetry.instrumentation.gnap:GNAPInstrumentor"

[dependency-groups]
dev = ["pytest>=8.2.2,<10", "ruff>=0.4.0"]
test = ["opentelemetry-sdk>=1.38.0,<2", "pytest>=8.2.2,<10", "pytest-asyncio>=0.23.7,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opentelemetry"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
